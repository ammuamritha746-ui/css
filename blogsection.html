<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Featured Blog Section</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f4f4;
    padding:20px;
}

.blog-section{
    background:white;
    padding:20px;
}

.blog-section h1{
    text-align:center;
    margin-bottom:20px;
}

.blog-container{
    display:flex;
    justify-content:space-between;
    gap:20px;
}

.blog-card{
    width:30%;
    background:#fff;
    border:1px solid #ccc;
    border-radius:10px;
    padding:15px;
    text-align:center;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

.blog-card img{
    width:100%;
    height:200px;
    object-fit:cover;
    margin:10px 0;
}

.blog-card h2{
    margin-bottom:10px;
}

.blog-card p{
    margin-bottom:15px;
}

/* Highlight only https links */
a[href^="https"]{
    color:red;
    font-weight:bold;
}

/* Images ending with .jpg */
img[src$=".jpg"]{
    border-top-right-radius:25px;
    border-bottom-left-radius:25px;
}

/* Small screens */
@media (max-width:600px){

.blog-container{
    flex-direction:column;
}

.blog-card{
    width:100%;
}

body{
    font-size:14px;
}

}

/* Portrait orientation */
@media (orientation:portrait){

.blog-section{
    background-color:lightyellow;
}

}
</style>

</head>
<body>

<section class="blog-section">

<h1>Featured Blog Section</h1>

<div class="blog-container">

<div class="blog-card">
<h2>Travel Blog</h2>
<img src="travel.jpg" alt="Travel">
<p>Discover amazing places around the world and travel tips.</p>
<a href="https://travel.com">Read More</a>
</div>

<div class="blog-card">
<h2>Food Blog</h2>
<img src="food.jpg" alt="Food">
<p>Explore delicious recipes and healthy food ideas.</p>
<a href="http://food.com">Read More</a>
</div>

<div class="blog-card">
<h2>Technology Blog</h2>
<img src="tech.jpg" alt="Technology">
<p>Learn about AI, programming, and the latest technology.</p>
<a href="https://techcrunch.com">Read More</a>
</div>

</div>

</section>

</body>
</html>
